<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ASF Checklist — Pré-surf completo | ASF</title><meta name="description" content="Checklist pré-surf interativo: equipamento, condições do mar e segurança antes de entrar na água. Satélite do app ASF."><link rel="canonical" href="https://acarolmourad-commits.github.io/asf-checklist/"><meta name="theme-color" content="#00A8CC"><style>:root{--p:#00A8CC;--d:#0E2439;--u:#9B59B6;--bg:#F7FBFC;--g:#5A6B7A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--d)}nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #E5EEF2;padding:10px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}nav a{color:var(--p);text-decoration:none;font-weight:700;font-size:13px}nav a.on{color:var(--u)}header{background:linear-gradient(135deg,var(--p),var(--u));color:#fff;padding:40px 20px 30px;text-align:center}.wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(14,36,57,.06)}.card h2{font-size:15.5px;margin-bottom:6px}label{display:flex;gap:10px;padding:5px 0;font-size:14.5px;cursor:pointer}input{accent-color:var(--p)}.ok{display:none;background:#E3F8EF;border-left:5px solid #0B8A5F;border-radius:12px;padding:16px;margin-top:8px;font-weight:700;color:#0B8A5F}.muted{color:var(--g);font-size:12.5px}footer{text-align:center;font-size:12.5px;color:var(--g);padding:24px;border-top:1px solid #E5EEF2}</style></head><body><nav><a href="https://acarolmourad-commits.github.io/asf-app/">🏄 App</a><a class="on" href="https://acarolmourad-commits.github.io/asf-checklist/">✅ Checklist</a><a href="https://acarolmourad-commits.github.io/asf-mala/">🎒 Mala</a><a href="https://acarolmourad-commits.github.io/asf-previsao/">🌊 Previsão</a><a href="https://acarolmourad-commits.github.io/asf-seguranca/">🛟 Segurança</a></nav><header><h1>✅ Checklist pré-surf</h1><p>Marque tudo e entre na água com tranquilidade.</p></header><main class="wrap"><div class="card"><h2>🎒 Equipamento</h2><label><input type="checkbox"> Prancha ok, leash preso</label><label><input type="checkbox"> Parafina aplicada</label><label><input type="checkbox"> Protetor solar no rosto</label><label><input type="checkbox"> Hidratei e comi algo leve</label></div><div class="card"><h2>🌊 Condições</h2><label><input type="checkbox"> Vi a <a href="https://acarolmourad-commits.github.io/asf-previsao/">previsão</a> (ondas, vento, maré)</label><label><input type="checkbox"> Observei o mar por 10 min antes de entrar</label><label><input type="checkbox"> Identifiquei correntes e canal de saída</label><label><input type="checkbox"> Escolhi pico adequado ao meu nível (<a href="https://acarolmourad-commits.github.io/asf-praias/">guia</a>)</label></div><div class="card"><h2>🛟 Segurança</h2><label><input type="checkbox"> Alguém sabe que estou no mar</label><label><input type="checkbox"> Aqueci ombros e quadril</label><label><input type="checkbox"> Revisei as regras de prioridade</label></div><div class="ok" id="ok">🌊 Tudo pronto — boa sessão, mana!</div></main><footer>🌊 ASF · <a href="https://acarolmourad-commits.github.io/" style="color:var(--p)">Hub de apps</a></footer><script>const boxes=document.querySelectorAll('input');function att(){let t=true;boxes.forEach(b=>t=t&&b.checked);document.getElementById('ok').style.display=t?'block':'none';}boxes.forEach(b=>b.onchange=att);</script></body></html>
